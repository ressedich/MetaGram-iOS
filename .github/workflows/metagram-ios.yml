name: MetaGram iOS

# Builds an unsigned MetaGram.ipa (release, arm64) with the repository's test
# certificates. Sign it yourself (Sideloadly / AltStore) before installing.
# The Bazel cache is saved even when a run fails, so a re-run continues faster.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'metagram/*.html'

concurrency:
  group: metagram-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS (unsigned .ipa)
    runs-on: xcode-27
    timeout-minutes: 355

    env:
      SOURCE_DIR: /Users/Shared/telegram-ios
      BAZEL_USER_ROOT: /private/var/tmp/_bazel_containerhost
      CACHE_DIR: /Users/Shared/telegram-bazel-cache

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode.
        run: |
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s /Applications/Xcode_$XCODE_VERSION.app/Contents/Developer
          xcodebuild -version

      - name: Move sources to a stable path.
        # source paths end up in the binary, so they must not change between builds
        run: |
          sudo mkdir -p /Users/Shared
          sudo chown "$USER" /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" "$SOURCE_DIR"
          mkdir -p "$CACHE_DIR"

      - name: Refresh the test provisioning profiles.
        # The repository's fake profiles have an ExpirationDate in the past, which rules_apple rejects.
        # Keep every field, move only the date, and re-wrap them in a CMS envelope: rules_apple reads
        # profiles without checking the signature (openssl smime -noverify fallback).
        run: |
          set -e
          cd "$SOURCE_DIR/build-system/fake-codesigning/profiles"
          WORK=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$WORK/key.pem" -out "$WORK/cert.pem" -days 3650 -subj "/CN=MetaGram Test Profiles"
          for p in *.mobileprovision; do
            security cms -D -i "$p" > "$WORK/profile.plist" 2>/dev/null || openssl smime -inform der -verify -noverify -in "$p" > "$WORK/profile.plist"
            python3 -c 'import plistlib, sys, datetime; f = sys.argv[1]; d = plistlib.load(open(f, "rb")); d["ExpirationDate"] = datetime.datetime(2036, 1, 1); plistlib.dump(d, open(f, "wb"))' "$WORK/profile.plist"
            openssl cms -sign -nodetach -binary -outform DER -in "$WORK/profile.plist" -signer "$WORK/cert.pem" -inkey "$WORK/key.pem" -out "$p"
            echo "$p: $(openssl smime -inform der -verify -noverify -in "$p" 2>/dev/null | grep -A1 ExpirationDate | tail -n 1)"
          done
          rm -rf "$WORK"

      - name: Restore Bazel cache.
        uses: actions/cache/restore@v4
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: bazel-ios-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}
          restore-keys: |
            bazel-ios-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-
            bazel-ios-

      - name: Build MetaGram.
        id: build
        timeout-minutes: 320
        run: |
          set -x
          cd "$SOURCE_DIR"
          BUILD_NUMBER="$(( $(git rev-list --count HEAD) + $(cat build_number_offset) ))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$CACHE_DIR" \
            --overrideXcodeVersion \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          mkdir -p "$GITHUB_WORKSPACE/artifact"
          # bazel-bin points at the last build's configuration (the bazel-out folder names change between versions)
          cp -L bazel-bin/Telegram/Telegram.ipa "$GITHUB_WORKSPACE/artifact/MetaGram.ipa"
          ls -la "$GITHUB_WORKSPACE/artifact"

      - name: Save Bazel cache.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: /Users/Shared/telegram-bazel-cache
          key: bazel-ios-${{ hashFiles('versions.json', 'MODULE.bazel.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload MetaGram.ipa.
        uses: actions/upload-artifact@v4
        with:
          name: MetaGram-iOS-${{ env.BUILD_NUMBER }}
          path: artifact/MetaGram.ipa
          retention-days: 30
